<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 20px rgba(37, 99, 235, 0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        h2 { 
            margin-top: 0; 
            color: #f8fafc; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.3s;
        }
        input::placeholder { color: #64748b; }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }
        .error { 
            color: #ef4444; 
            margin-top: 15px; 
            font-size: 0.9rem; 
            display: none; 
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="icon">🛡️</span>
        <h2>Panel de Administración</h2>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <div id="errorMsg" class="error">Credenciales incorrectas</div>
        <div style="margin-top: 25px; font-size: 0.8rem; color: #64748b; letter-spacing: 0.5px;">
            Desarrollado y administrado por <strong style="color: #94a3b8;">Ing.aviles</strong>
        </div>
    </div>

    <script>
        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({username: u, password: p})
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/admin.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
