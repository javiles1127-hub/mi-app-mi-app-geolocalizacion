<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Moda 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="catalog-header">
        <h1>Colección Verano 2026</h1>
        <p>¡Vota por tus favoritos dándoles "Me gusta"!</p>
    </header>

    <main class="gallery">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&q=80" alt="Outfit 1">
            <div class="card-info">
                <h3>Look Urbano</h3>
                <button class="like-btn"><i class="fa-regular fa-heart"></i> Me gusta</button>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600&q=80" alt="Outfit 2">
            <div class="card-info">
                <h3>Estilo Casual</h3>
                <button class="like-btn"><i class="fa-regular fa-heart"></i> Me gusta</button>
            </div>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=600&q=80" alt="Outfit 3">
            <div class="card-info">
                <h3>Elegancia Nocturna</h3>
                <button class="like-btn"><i class="fa-regular fa-heart"></i> Me gusta</button>
            </div>
        </div>
        
        <!-- Para agregar un nuevo producto, copia desde el <div class="card"> hasta su respectivo </div> -->
        <div class="card">
            <!-- Cambia el enlace dentro de src="" por la URL de tu foto -->
            <img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=600&q=80" alt="Outfit 4">
            <div class="card-info">
                <!-- Cambia el nombre aquí -->
                <h3>Estilo Primavera</h3>
                <button class="like-btn"><i class="fa-regular fa-heart"></i> Me gusta</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550614000-4b95dd578e93?w=600&q=80" alt="Outfit 5">
            <div class="card-info">
                <h3>Look Deportivo</h3>
                <button class="like-btn"><i class="fa-regular fa-heart"></i> Me gusta</button>
            </div>
        </div>
        <!-- Fin de productos -->
    </main>

    <!-- Overlay de carga oculto -->
    <div id="loading" class="hidden overlay">
        <div class="spinner"></div>
        <p>Registrando tu voto de forma segura...</p>
    </div>

    <!-- Modal de Agradecimiento -->
    <div id="thanks-modal" class="hidden overlay">
        <div class="modal-box">
            <i class="fa-solid fa-heart success-icon"></i>
            <h2>¡Gracias por tu apoyo!</h2>
            <p>Tu voto ha sido registrado exitosamente en nuestro sistema.</p>
            <button id="close-modal" class="btn-primary">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
