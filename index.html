<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Moda 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="catalog-header">
        <h1>Colección Verano 2026</h1>
        <p>¡Vota por tus favoritos dándoles "Me gusta"!</p>
    </header>

    <main class="gallery" id="gallery-container">
        <div style="text-align: center; width: 100%; padding: 2rem;">Cargando catálogo...</div>
    </main>

    <footer style="text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; margin-top: 2rem; border-top: 1px solid #eaeaea;">
        Proyecto creado por <strong>Ing.aviles</strong> &copy; 2026
    </footer>

    <!-- Overlay de carga oculto -->
    <div id="loading" class="hidden overlay">
        <div class="spinner"></div>
        <p>Registrando tu voto de forma segura...</p>
    </div>

    <!-- Modal de Agradecimiento -->
    <div id="thanks-modal" class="hidden overlay">
        <div class="modal-box">
            <i class="fa-solid fa-heart success-icon"></i>
            <h2>¡Gracias por tu apoyo!</h2>
            <p>Tu voto ha sido registrado exitosamente en nuestro sistema.</p>
            <button id="close-modal" class="btn-primary">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${p.image}" alt="${p.name}">
                            <div class="card-info">
                                <h3>${p.name}</h3>
                                <button class="like-btn" data-id="${p.id}">
                                    <i class="fa-regular fa-heart"></i> Me gusta (<span class="like-count">${p.likes || 0}</span>)
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
