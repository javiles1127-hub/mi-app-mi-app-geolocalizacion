<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShopLink</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="catalog-header">
        <h1 class="logo-title"><i class="fa-solid fa-bag-shopping logo-icon"></i> MyShopLink</h1>
        <p>¡Vota por tus favoritos dándoles "Me gusta"!</p>
    </header>

    <main class="gallery" id="gallery-container">
        <div style="text-align: center; width: 100%; padding: 2rem;">Cargando catálogo...</div>
    </main>

    <footer style="text-align: center; padding: 2rem; color: #888; font-size: 0.9rem; margin-top: 2rem; border-top: 1px solid #eaeaea;">
        <div style="margin-bottom: 1rem; font-size: 1.5rem;">
            <p style="font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; color: #333;">¡Síguenos en nuestras redes!</p>
            <a href="https://www.facebook.com/" target="_blank" style="color: #1877F2; margin: 0 10px; text-decoration: none;"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.instagram.com/" target="_blank" style="color: #E1306C; margin: 0 10px; text-decoration: none;"><i class="fa-brands fa-instagram"></i></a>
        </div>
        Proyecto creado por <strong>Ing.aviles</strong> &copy; 2026
    </footer>

    <!-- Modal de Contacto -->
    <div id="contact-modal" class="hidden overlay">
        <div class="modal-box">
            <h2 id="contact-product-name" style="margin-bottom: 1rem; font-size: 1.2rem;">Me interesa</h2>
            <form id="contact-form">
                <input type="hidden" id="contact-product-id">
                <div style="margin-bottom: 1rem; text-align: left;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Tu Nombre</label>
                    <input type="text" id="contact-name" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 1.5rem; text-align: left;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">WhatsApp / Teléfono</label>
                    <input type="tel" id="contact-phone" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 0;">Enviar mis datos</button>
                <button type="button" id="close-contact" style="background: none; border: none; margin-top: 1rem; color: #888; text-decoration: underline; cursor: pointer;">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Overlay de carga oculto -->
    <div id="loading" class="hidden overlay">
        <div class="spinner"></div>
        <p>Registrando tu voto de forma segura...</p>
    </div>

    <!-- Modal de Agradecimiento -->
    <div id="thanks-modal" class="hidden overlay">
        <div class="modal-box">
            <i class="fa-solid fa-heart success-icon"></i>
            <h2>¡Gracias por tu apoyo!</h2>
            <p>Tu voto ha sido registrado exitosamente en nuestro sistema.</p>
            <button id="close-modal" class="btn-primary">Cerrar</button>
        </div>
    </div>

    <script src="script.js?v=2"></script>
    <script>
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${p.image}" alt="${p.name}">
                            <div class="card-info" style="flex-direction: column; align-items: flex-start;">
                                <h3>${p.name}</h3>
                                <div style="display: flex; gap: 10px; width: 100%; margin-top: 5px;">
                                    <button class="contact-btn" style="flex:1; background:#2563eb; color:white; border:none; border-radius:20px; padding:0.5rem; font-weight:600; cursor:pointer;" data-id="${p.id}" data-name="${p.name}">Consultar</button>
                                    <button class="like-btn" style="flex:1; justify-content:center;" data-id="${p.id}">
                                        <i class="fa-regular fa-heart"></i> (<span class="like-count">${p.likes || 0}</span>)
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
